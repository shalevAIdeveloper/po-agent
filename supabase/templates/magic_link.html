<!-- Magic-link sign-in is not used by PO Agent. Auth still sends this email when
     someone requests it, so it carries no link and no code (sec L, 0.4c-2). -->
<h2>PO Agent sign-in request</h2>
<p>Someone asked to sign in to PO Agent with this email address. PO Agent doesn't use email sign-in links, so there's nothing to do.</p>
<p>Sign in with your password, or use "Forgot your password?" on the sign-in page.</p>
<p>If this keeps happening, tell your organization's admin.</p>
