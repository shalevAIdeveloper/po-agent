<!-- Password reset email (local + hosted). Same /auth/confirm flow as the invite. -->
<h2>Reset your PO Agent password</h2>
<p>Someone asked to reset the password for this email address.</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery">Choose a new password</a>
</p>
<p>This link works once and expires in 1 hour.</p>
<p>If you didn't ask for this, you can ignore this email; your password stays the same.</p>
