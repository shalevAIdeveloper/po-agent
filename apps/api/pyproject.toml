[project]
name = "po-agent-api"
version = "0.1.0"
description = "PO Agent API and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.32.0",
    # No `[standard]` extra at runtime: it pulls the OpenTelemetry SDK + OTLP exporter,
    # which env vars alone could switch on (L6). It stays in the dev group for `fastapi dev`.
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2",
    "structlog>=26.1.0",
    "anthropic~=2.3.0",
    "pypdfium2~=5.14.0",
    "pillow~=13.0.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
# S105/S106: tests use fake credentials on purpose (redaction checks)
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# asyncpg ships no type information; only operator tools import it directly.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# pypdfium2 ships no type information either; only `app/extraction/inputs/pdf.py` uses it.
[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not integration and not live'"
# A hung test (e.g. a frozen event-loop clock) fails fast instead of eating the CI
# job (A9). `thread` works on Windows too; integration tests share the same limit.
timeout = 60
timeout_method = "thread"
markers = [
  "integration: needs local Supabase (DATABASE_URL); run with -m integration",
  "live: calls the real LLM API with LLM_API_KEY (costs money); never in CI; run with -m live",
]

[dependency-groups]
dev = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.162.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-timeout>=2.4.0",
    "reportlab~=5.1.0",
    "ruff>=0.17.4",
]
