[project]
name = "po-agent-api"
version = "0.1.0"
description = "PO Agent API and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.162.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2",
    "structlog>=26.1.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
# S105/S106: tests use fake credentials on purpose (redaction checks)
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not integration'"
markers = [
  "integration: needs local Supabase (DATABASE_URL); run with -m integration",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]
