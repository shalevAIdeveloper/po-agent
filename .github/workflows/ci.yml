name: CI
on:
  pull_request:
    # m1/engine: temporary M1 integration branch (docs/plans/m1.md), deleted after it
    # merges into dev. No push trigger for it: nothing deploys from it.
    # `edited` re-runs CI when a PR's base changes (m1/engine -> dev, also automatic when
    # m1/engine is deleted), so a ci-ok computed under the m1/engine evals exception never
    # stays attached to a PR into dev (sec H1).
    types: [opened, synchronize, reopened, edited]
    branches: [dev, main, m1/engine]
  push:
    branches: [dev, main]
# No workflow-level paths/paths-ignore: Railway's checkSuites gate needs a CI suite on
# every push to dev, or it deploys without waiting (jobs filter paths themselves).

# Least privilege: jobs only read the repo unless a job asks for more.
permissions:
  contents: read

# Cancel superseded runs on PRs only. A cancelled run on dev/main would make Railway
# skip that commit's deploy (checkSuites), and a later commit that touches no watched
# path would never deploy it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to full commit SHAs (tag in the trailing comment).
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files via the API
    outputs:
      api: ${{ steps.f.outputs.api }}
      web: ${{ steps.f.outputs.web }}
      db: ${{ steps.f.outputs.db }}
      evals: ${{ steps.f.outputs.evals }}
      images: ${{ steps.f.outputs.images }}
      evals_baseline: ${{ steps.baseline.outputs.exists }}
    steps:
      # Full history: on push, paths-filter diffs commits locally and cannot fetch without creds.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false, fetch-depth: 0 }
      # Read by ci-ok: the m1/engine evals exception ends once the baseline is committed (M1 PR 9).
      - id: baseline
        run: |
          if [ -f apps/api/evals/baseline.json ]; then echo "exists=true"; else echo "exists=false"; fi >> "$GITHUB_OUTPUT"
      - id: f
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            # apps/web + ignore files: tests/test_railway_upload.py checks the upload filter
            api: ['apps/api/**', 'supabase/**', '.github/workflows/**', 'apps/web/**', '**/.railwayignore', '**/.gitignore']
            web: ['apps/web/**', 'apps/api/openapi.json', '.github/workflows/**']
            db: ['supabase/**', 'apps/api/**', '.github/workflows/**']
            # G2 (`.github/workflows/**`) is added in M1 PR 8, not now: evals fails until the
            # baseline (PR 9), and PRs into dev have no ci-ok exception for it.
            evals: ['apps/api/app/prompts/**', 'apps/api/app/extraction/**', 'apps/api/app/llm/**', 'apps/api/evals/**']
            images: ['apps/api/**', 'apps/web/**', '.railway/**', '.railwayignore', '.github/**']

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with: { version: "0.13.7" }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tools
      - run: uv run pytest -q

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    env:
      # Inlined at build time. Nothing listens here, so e2e exercises the error state;
      # the auth specs skip (they run in `e2e-auth` against the real stack).
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { package_json_file: apps/web/package.json }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types are generated from the committed OpenAPI schema
        run: |
          git ls-files --error-unmatch src/lib/api/schema.d.ts
          pnpm gen:api
          test -z "$(git status --porcelain -- src/lib/api/schema.d.ts)"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # W5: browsers cached per Playwright version; OS deps are still installed each run.
      - id: pw
        # Fail on an empty version: the key would collapse to "playwright-Linux-".
        run: |
          v=$(pnpm exec playwright --version | awk '{print $2}')
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # Web auth end to end: local Supabase (Auth + Postgres + PostgREST for test cleanup),
  # the real API as `po_api` (started by Playwright), and the production web build.
  e2e-auth:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_AUTH: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with: { version: "2.117.0" }
      # Mailpit stays: invite and reset e2e read their links from it.
      - working-directory: .
        run: >-
          supabase start
          -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      # Local-only, well-known keys of the throwaway stack (not secrets).
      - name: Export local Supabase keys
        working-directory: .
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          get() { grep "^$1=" "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"'; }
          {
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(get PUBLISHABLE_KEY)"
            echo "E2E_SUPABASE_SECRET_KEY=$(get SECRET_KEY)"
          } >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with: { version: "0.13.7" }
      - run: uv sync --frozen
        working-directory: apps/api
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { package_json_file: apps/web/package.json }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: pw
        # Fail on an empty version: the key would collapse to "playwright-Linux-".
        run: |
          v=$(pnpm exec playwright --version | awk '{print $2}')
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-auth
          path: apps/web/playwright-report
          retention-days: 7

  db:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      # Same CLI version as local dev; the v3 upgrade is a separate PR.
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with: { version: "2.117.0" }
      # Postgres + Auth (GoTrue behind Kong) + PostgREST: applies roles.sql and all
      # migrations to a fresh database; Auth and the Data API (the admin tool's RPC)
      # are needed for the API integration tests.
      - run: >-
          supabase start
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      # Local-only, well-known keys of the throwaway stack (not secrets).
      - name: Export local Supabase keys for integration tests
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          get() { grep "^$1=" "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"'; }
          {
            echo "INTEGRATION_SUPABASE_URL=$(get API_URL)"
            echo "INTEGRATION_SUPABASE_PUBLISHABLE_KEY=$(get PUBLISHABLE_KEY)"
            echo "INTEGRATION_SUPABASE_SECRET_KEY=$(get SECRET_KEY)"
          } >> "$GITHUB_ENV"
      - run: supabase db lint --local --level warning --fail-on warning
      - run: supabase db advisors --local --type all --fail-on warn
      # pgTAP: RLS, grants, cross-org isolation (supabase/tests)
      - run: supabase test db
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with: { version: "0.13.7" }
      - name: API integration tests against the local database
        working-directory: apps/api
        env:
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          # po_api password comes from supabase/roles.sql (local-only value).
          INTEGRATION_API_DATABASE_URL: postgresql://po_api:po_api_local_only@127.0.0.1:54322/postgres
        run: |
          uv sync --frozen
          uv run pytest -m integration -q -rs

  # Deploy images (0.5c, ADR 0008): Railway builds the same Dockerfiles after merge, so
  # a broken image must fail here first. Also typechecks the Railway IaC file.
  images:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - name: Build images and check how they start
        run: bash .github/scripts/smoke-images.sh
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { package_json_file: .railway/package.json }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: .railway/pnpm-lock.yaml
      - name: Railway IaC typechecks
        working-directory: .railway
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck

  evals:
    needs: changes
    if: needs.changes.outputs.evals == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    # No secrets and no network (owner decision Q9): replays recorded answers only. It
    # fails until there are fixtures, recordings, a baseline and scoring (M1 PRs 6-9);
    # the live eval is a separate, manual workflow (PR 8).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with: { version: "0.13.7" }
      - run: uv sync --frozen
      - run: uv run python -m evals.run --replay --fail-on-regression

  # The single required status check for branch protection. Path filters skip jobs,
  # and a skipped job can't be "required", so this job aggregates them: every job
  # must have succeeded or been skipped, and `changes` must have succeeded (if it
  # failed, every other job is skipped and that must not count as green).
  ci-ok:
    if: always()
    # Every job must be listed here, or it isn't covered by the required check.
    needs: [changes, api, web, e2e-auth, db, images, evals]
    runs-on: ubuntu-latest
    steps:
      # One explicit, temporary exception (owner decision, docs/plans/m1.md "Integration
      # branch"): on a PR into m1/engine, and only while apps/api/evals/baseline.json does
      # not exist, a *failed* evals job is allowed so the engine can be built before any
      # recording exists. evals still runs and shows red. PRs into dev/main never get it.
      - name: All jobs succeeded or were skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVALS_MAY_FAIL: ${{ github.event_name == 'pull_request' && github.base_ref == 'm1/engine' && needs.changes.outputs.evals_baseline == 'false' }}
        run: |
          # Expressions compare case-insensitively; re-check the base ref exactly (sec L4).
          if [ "$GITHUB_BASE_REF" != "m1/engine" ]; then export EVALS_MAY_FAIL=false; fi
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '
            .changes.result == "success"
            and (to_entries | all(
              .value.result == "success" or .value.result == "skipped"
              or (.key == "evals" and .value.result == "failure" and env.EVALS_MAY_FAIL == "true")
            ))
          ' > /dev/null
          if [ "$EVALS_MAY_FAIL" = "true" ] && echo "$NEEDS" | jq -e '.evals.result == "failure"' > /dev/null; then
            echo "::warning::evals failed: allowed only on PRs into m1/engine before the eval baseline exists"
          fi
