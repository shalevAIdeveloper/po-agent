name: Deployed check
# A13 / ADR 0009: run `pnpm test:deployed` against the deployed dev web from GitHub's
# network, as the second client of the rate-limit check (runbook railway.md, "Rate limit
# check"). By hand only; not part of CI or `ci-ok`.
#
# Run it only after the web deploy of the current `dev` commit has finished: a dispatched
# run is a check suite on that commit, and Railway's checkSuites gate waits for those.
on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read # the guard step lists this commit's check suites
  actions: read # ...and looks up this run's own suite

concurrency:
  group: deployed-check
  cancel-in-progress: false

jobs:
  rate-limit:
    # Guards against an accidental dispatch on another branch. (A branch's copy of this
    # file could drop it; that needs write access, which can already run any workflow.)
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: apps/web } }
    env:
      # Fixed target, not an input: the workflow can't be pointed at another site.
      DEPLOYED_WEB_URL: https://web-dev-3fce.up.railway.app
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # Railway deploys a dev commit only after every check suite on it passed. Running
      # while CI is still going would add this run to that gate (a failure here could
      # skip the deploy) or let the deploy restart web mid-check. So: only once every
      # other suite on this commit has finished. (The deploy itself may still be rolling
      # out after that; the runbook checks the active deployment before and after.)
      - name: Every other check suite on this commit has finished
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        working-directory: .
        run: |
          own=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .check_suite_id)
          test -n "$own"
          # Only GitHub Actions suites (CI, migrate): other apps (e.g. the Claude app) leave
          # a suite queued forever with no runs, which Railway's gate ignores too.
          pending=$(gh api "repos/$REPO/commits/$SHA/check-suites" --paginate \
            --jq "[.check_suites[] | select(.app.slug == \"github-actions\" and .id != $own and .status != \"completed\")] | length" \
            | awk '{s += $1} END {print s + 0}')
          if [ "$pending" != "0" ]; then
            echo "::error::$pending other check suite(s) on $SHA are still running. Wait for CI and the web deploy to finish, then run this again."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with: { package_json_file: apps/web/package.json }
      # No `cache: pnpm`: its post step would save a pnpm store into the dev cache scope
      # that CI restores. This workflow only reads caches.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: apps/web/.nvmrc
      - run: pnpm install --frozen-lockfile
      - id: pw
        # Fail on an empty version: the key would collapse to "playwright-Linux-".
        run: |
          v=$(pnpm exec playwright --version | awk '{print $2}')
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # Restore only: this workflow never writes a cache.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:deployed
